name: Deploy to Preprod

on:
  push:
    branches: [preprod]
  workflow_dispatch:

env:
  RAILWAY_SERVICE: heir-eliza

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preproduction
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PREPROD }}
        run: railway up --service "${{ env.RAILWAY_SERVICE }}" --environment preproduction --detach
