# Railway configuration for heir-eliza service in pre-production environment

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
numReplicas = 1

[env]
NODE_ENV = "production"
PORT = "3005"

# Pre-production tier identification
RAILWAY_ENVIRONMENT = "preprod"
SERVICE_NAME = "heir-eliza"

# API connections
HEIR_API_URL = "https://api-preprod.heir.es"
MONGODB_URI = "mongodb+srv://heir-preprod.mongodb.net"

# Eliza configuration
ELIZA_AGENT_ID = "heir-estate-advisor-preprod"
ELIZA_WORLD_ID = "heir-estate-planning-preprod"

# AI model configuration  
OPENAI_API_KEY = "sk-..."
ANTHROPIC_API_KEY = "sk-ant-..."

# Character and behavior settings
ELIZA_CHARACTER_FILE = "characters/heir-estate-advisor.json"
ELIZA_PERSONALITY = "professional-estate-advisor"
ELIZA_MAX_MEMORY_ITEMS = "1000"

# Logging
LOG_LEVEL = "info"
LOG_FORMAT = "json"

# Feature flags
ENABLE_DEBUG_ENDPOINTS = "false"
ENABLE_EXPERIMENTAL_FEATURES = "false"